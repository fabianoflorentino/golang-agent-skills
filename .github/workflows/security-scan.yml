name: Security scan skills

on:
  push:
    branches: [main]
    paths: ['skills/**']
  pull_request:
    paths: ['skills/**']
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month at 10am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snyk-agent-scan:
    if: github.event_name != 'schedule' || github.repository_owner == 'fabianoflorentino'
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Run Snyk Agent Scan
        if: env.SNYK_TOKEN != ''
        run: uvx snyk-agent-scan@latest --ci --dangerously-run-mcp-servers --skills ./skills
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
