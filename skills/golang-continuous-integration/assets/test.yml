name: Tests

# Run on pushes to the default branch and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The test job writes nothing to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      # A single Go version failing must not cancel the remaining rows.
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "1.27"
          - "stable"

    steps:
      - uses: actions/checkout@v6

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Validate the build cache
        run: |
          go mod verify
          go mod download

      - name: Enforce tidy go.mod / go.sum
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Compile all packages
        run: go build ./...

      - name: Run tests with race detector
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Upload coverage report
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}