name: Dependabot Auto-Merge

# Act on pull requests only.
on:
  pull_request:

# Elevated on purpose: this job has to merge PRs. The guard below confines it to Dependabot.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge
    runs-on: ubuntu-latest
    # Never remove this guard: execution is restricted to Dependabot's own PRs.
    # github.actor checks are not fully spoof-proof — branch protection with
    # required checks and approvals remains the real safety net.
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Minor and patch updates merge automatically; majors stay human-reviewed.
      - name: Auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}