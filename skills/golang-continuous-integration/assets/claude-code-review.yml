name: AI Code Review (Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Security note: these permissions are repository-wide, not PR-scoped.
# `pull-requests: write` lets the workflow post and resolve comments on ANY PR;
# `actions: read` exposes logs from ANY run, which may contain sensitive output.
# Bound the risk by triggering only from trusted contributors or protected
# branches, and never echo secrets into CI logs.
permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read
  id-token: write

# One review pass per PR per event type; a newer run cancels its predecessor.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Job 1: quality review, suggestion-first — style, naming, documentation.
  quality:
    name: Review — Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip bot-authored PRs (Dependabot, Renovate, etc.); drop the filter to review them too.
    if: ${{ github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Go skills
        run: npx skills add https://github.com/fabianoflorentino/golang-agent-skills -a claude-code --skill '*' -y --copy

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          use_sticky_comment: true
          track_progress: true
          sticky_comment_header: "<!-- claude-review-quality -->"
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__context7__resolve-library-id,mcp__context7__query-docs,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            AUTHOR: ${{ github.event.pull_request.user.login }}

            You are a senior Go engineer carrying out a code-quality review.

            Review this pull request.
            - Read the diff with `gh pr diff`.
            - Read the description and metadata with `gh pr view`.
            - Post every line-specific issue through `mcp__github_inline_comment__create_inline_comment`
              with `confirmed: true`, adding a ```suggestion block when the fix is a direct
              1:1 replacement of the selected lines.
            - Reserve `gh pr comment` for a top-level summary.
            - Post nothing else. No chat output.

            ## Scope — apply these skill guidelines

            - **Code style** — formatting, comments, idiomatic Go (Skill("golang-code-style")).
            - **Naming** — packages, types, variables, functions, constants (Skill("golang-naming")).
            - **Documentation** — exported symbols, package docs, README impact (Skill("golang-documentation")).

            ## Priority — suggestion-first

            These areas are readability, not correctness. Raise something only when it will confuse
            future readers, mislead consumers of an exported API, or hamper navigation at scale.
            Do not flag formatting `gofmt` already handles, nor a clear stylistic choice.

            ## How to report

            Every comment must:
            1. Name the concrete problem, not just its symptom.
            2. State the conditions under which it matters or fails.
            3. Offer a specific fix — renamed identifier, corrected snippet, or safer pattern.

            Keep comments short. Comment only when there is a real issue; do not praise the good
            parts. If nothing is wrong, post nothing. Before posting, check the point was not
            already made in an earlier review comment.

            The PR branch is already checked out in the working directory.

            Check project guidelines: @./CLAUDE.md
            Check contributing guidelines: @./CONTRIBUTING.md
            Check project description: @./docs/project-summary.md

            Label each comment: **SUGGESTION**

  # Job 2: correctness review, blocking-first — errors, safety, concurrency.
  correctness:
    name: Review — Correctness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip bot-authored PRs (Dependabot, Renovate, etc.); drop the filter to review them too.
    if: ${{ github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Go skills
        run: npx skills add https://github.com/fabianoflorentino/golang-agent-skills -a claude-code --skill '*' -y --copy

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          use_sticky_comment: true
          track_progress: true
          sticky_comment_header: "<!-- claude-review-correctness -->"
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__context7__resolve-library-id,mcp__context7__query-docs,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            AUTHOR: ${{ github.event.pull_request.user.login }}

            You are a senior Go engineer carrying out a correctness and safety review.

            Review this pull request.
            - Read the diff with `gh pr diff`.
            - Read the description and metadata with `gh pr view`.
            - Post every line-specific issue through `mcp__github_inline_comment__create_inline_comment`
              with `confirmed: true`, adding a ```suggestion block when the fix is a direct
              1:1 replacement of the selected lines.
            - Reserve `gh pr comment` for a top-level summary.
            - Post nothing else. No chat output.

            ## Scope — apply these skill guidelines

            - **Error handling** — wrapping, sentinel errors, log-and-return, swallowed errors (Skill("golang-error-handling")).
            - **Code safety** — nil dereference, aliasing, integer overflow, uninitialized state (Skill("golang-safety")).
            - **Concurrency** — goroutine lifecycle, mutex usage, channels, context propagation, races (Skill("golang-concurrency")).

            ## Priority — blocking-first

            A swallowed error, an unchecked nil, or an unsynchronized write can corrupt data
            silently or cause an outage. Flag these even when the fix is non-trivial.

            ## How to report

            Every comment must:
            1. Name the concrete problem, not just its symptom.
            2. State the conditions under which it matters or fails.
            3. Offer a specific fix — renamed identifier, corrected snippet, or safer pattern.

            Keep comments short. Comment only when there is a real issue; do not praise the good
            parts. If nothing is wrong, post nothing. Before posting, check the point was not
            already made in an earlier review comment.

            The PR branch is already checked out in the working directory.

            Check project guidelines: @./CLAUDE.md
            Check contributing guidelines: @./CONTRIBUTING.md
            Check project description: @./docs/project-summary.md

            Severity labels:
            - **BLOCKING** — definite bug, data race, or correctness failure; must be fixed before merge.
            - **IMPORTANT** — significant risk needing unusual conditions to manifest; strongly recommended.
            - **SUGGESTION** — defensive improvement for a low-probability failure or subtle edge case.

  # Job 3: security and dependency review, blocking-first.
  security:
    name: Review — Security & Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip bot-authored PRs (Dependabot, Renovate, etc.); drop the filter to review them too.
    if: ${{ github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Go skills
        run: npx skills add https://github.com/fabianoflorentino/golang-agent-skills -a claude-code --skill '*' -y --copy

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          use_sticky_comment: true
          track_progress: true
          sticky_comment_header: "<!-- claude-review-security -->"
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__context7__resolve-library-id,mcp__context7__query-docs,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            AUTHOR: ${{ github.event.pull_request.user.login }}

            You are a senior Go security engineer carrying out a security and dependency review.

            Review this pull request.
            - Read the diff with `gh pr diff`.
            - Read the description and metadata with `gh pr view`.
            - Post every line-specific issue through `mcp__github_inline_comment__create_inline_comment`
              with `confirmed: true`, adding a ```suggestion block when the fix is a direct
              1:1 replacement of the selected lines.
            - Reserve `gh pr comment` for a top-level summary.
            - Post nothing else. No chat output.

            ## Scope — apply these skill guidelines

            - **Security** — injection, auth, crypto misuse, sensitive-data exposure, input validation (Skill("golang-security")).
            - **Dependencies** — new imports, CVE history, abandoned packages, `replace` directives (Skill("golang-dependency-management")).

            ## Priority — blocking-first

            Security and supply-chain risks outrank style. One unvalidated input or a weak PRNG can
            open a critical vulnerability — do not downgrade these findings.

            ## How to report

            Every comment must:
            1. Name the concrete problem, not just its symptom.
            2. State the conditions under which it matters or fails.
            3. Offer a specific fix — renamed identifier, corrected snippet, or safer pattern.

            Keep comments short. Comment only when there is a real issue; do not praise the good
            parts. If nothing is wrong, post nothing. Before posting, check the point was not
            already made in an earlier review comment.

            The PR branch is already checked out in the working directory.

            Check project guidelines: @./CLAUDE.md
            Check contributing guidelines: @./CONTRIBUTING.md
            Check project description: @./docs/project-summary.md

            Severity labels:
            - **BLOCKING** — exploitable vulnerability or high-risk dependency; must be fixed before merge.
            - **IMPORTANT** — significant risk under specific conditions; strongly recommended.
            - **SUGGESTION** — defense-in-depth improvement; optional but worthwhile.

  # Job 4: tests, performance, observability, and modernization — mixed priority.
  quality-depth:
    name: Review — Tests, Performance & Observability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip bot-authored PRs (Dependabot, Renovate, etc.); drop the filter to review them too.
    if: ${{ github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Go skills
        run: npx skills add https://github.com/fabianoflorentino/golang-agent-skills -a claude-code --skill '*' -y --copy

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          use_sticky_comment: true
          track_progress: true
          sticky_comment_header: "<!-- claude-review-quality-depth -->"
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__context7__resolve-library-id,mcp__context7__query-docs,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            AUTHOR: ${{ github.event.pull_request.user.login }}

            You are a senior Go engineer reviewing tests, performance, observability, and modernization.

            Review this pull request.
            - Read the diff with `gh pr diff`.
            - Read the description and metadata with `gh pr view`.
            - Post every line-specific issue through `mcp__github_inline_comment__create_inline_comment`
              with `confirmed: true`, adding a ```suggestion block when the fix is a direct
              1:1 replacement of the selected lines.
            - Reserve `gh pr comment` for a top-level summary.
            - Post nothing else. No chat output.

            ## Scope — apply these skill guidelines

            - **Tests** — coverage of new code, test quality, table-driven tests, `t.Helper()` usage (Skill("golang-testing")).
            - **Performance** — needless allocations, inefficient structures, missing bounds (Skill("golang-performance")).
            - **Observability** — logging, metrics, tracing on new code paths (Skill("golang-observability")).
            - **Modernize code** — outdated patterns replaced with Go 1.21+ idioms (Skill("golang-modernize")).

            ## Priority

            - **Tests** and **Performance** are important: flag missing coverage on new exported paths
              and obvious allocation hot spots on critical paths.
            - **Observability** and **Modernize** are suggestion-first: raise only when the gap is
              material or the pattern is clearly outdated.

            ## How to report

            Every comment must:
            1. Name the concrete problem, not just its symptom.
            2. State the conditions under which it matters or fails.
            3. Offer a specific fix — renamed identifier, corrected snippet, or safer pattern.

            Keep comments short. Comment only when there is a real issue; do not praise the good
            parts. If nothing is wrong, post nothing. Before posting, check the point was not
            already made in an earlier review comment.

            The PR branch is already checked out in the working directory.

            Check project guidelines: @./CLAUDE.md
            Check contributing guidelines: @./CONTRIBUTING.md
            Check project description: @./docs/project-summary.md

            Severity labels:
            - **IMPORTANT** — missing test for a critical exported path; allocation hot spot on a latency-sensitive path.
            - **SUGGESTION** — observability gap, modernization opportunity, or minor test-quality improvement.

  # Job 5: diagnose CI failures after the review jobs settle.
  ci-diagnosis:
    name: Review — CI Failure Diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, correctness, security, quality-depth]
    if: ${{ always() && github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          use_sticky_comment: true
          track_progress: true
          sticky_comment_header: "<!-- claude-review-ci-diagnosis -->"
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(gh run list:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            WORKFLOW RUN ID: ${{ github.run_id }}

            You are a senior Go engineer diagnosing CI failures on this pull request.

            Determine whether any of the parallel review jobs (quality, correctness, security,
            quality-depth) failed in this run. If all succeeded, post nothing and exit.

            If any job failed:
            - Inspect its logs with `gh run view` and identify the root cause.
            - Post a single `gh pr comment` that states:
              1. Which job(s) failed and why (with a short log excerpt).
              2. Concrete steps to fix the failure (configuration change, missing secret, infra issue).
            - Post nothing else. No chat output.

  # Job 6: respond to human review activity on the PR, sparingly.
  discuss:
    name: Review — Discuss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ (github.event_name == 'pull_request_review_comment' || github.event_name == 'pull_request_review') && !endsWith(github.event.sender.login, '[bot]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          use_sticky_comment: false
          track_progress: false
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior Go engineer joining a code review conversation.

            A human has posted a review comment or submitted a review on this PR.
            Read the thread and decide whether a reply is warranted.

            Reply ONLY if:
            - The comment misstates a fact about Go semantics, the stdlib, or a dependency.
            - The proposed change would introduce a bug, regression, or security issue.
            - A brief clarification would unblock the discussion.

            Do NOT reply if:
            - Both approaches are valid and the point is stylistic.
            - The author already acknowledged the feedback.
            - A debate is in progress — let it resolve on its own.
            - You already replied in this thread.

            When replying: one or two sentences, direct, stating the technical fact. If the author
            disagrees after your reply, drop the thread. Prefer adding a 👍 reaction to acknowledge
            without commenting when the thread is settled or the point is already clear.

            Reply inline via `mcp__github_inline_comment__create_inline_comment` when the comment is
            line-specific, otherwise `gh pr comment`. Post nothing else. No chat output.